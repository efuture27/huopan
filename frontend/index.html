<script>
/* =========================================================================
 * 货盘助手 DEMO — Vue3 + Element Plus（后端联调版）
 * 前端调用真实 FastAPI 后端（§6 五个 API）：/api/auth/login · /api/product/upload
 * · /api/product/list · /api/product/sample · /api/profit/calculate · /api/profit/price
 * · /api/plan/generate
 * =========================================================================
 * // ---- TypeScript 类型定义（对应设计文档 §5 表结构）----
 * interface Product { id:number; sku:string; name:string; image_url:string;
 *   cost_price:number; category:string; remark:string; create_time:string }
 * interface User { id:number; username:string; password:string; role:string; status:number }
 * interface ProductPlan { id:number; name:string; creator:string; create_time:string }
 * interface ProductPlanItem { id:number; plan_id:number; product_id:number;
 *   pricing_mode:'price'|'margin'; sale_price:number; profit:number; profit_rate:number }
 * ========================================================================= */

const { createApp, ref, reactive, computed } = Vue;
const Msg = ElementPlus.ElMessage;
const ElMessageBox = ElementPlus.ElMessageBox;
const Icons = ElementPlusIconsVue;
// 显式取出用到的图标（避免模板中裸引用未定义变量导致崩溃）
const { Folder, Download, MagicStick, UploadFilled, Search, Delete, SwitchButton, Van, Plus, View, Files, RefreshRight } = Icons;

// API 基址：通过 nginx 同源代理时用相对路径；本地以 file:// 直接打开则回退到 localhost:8000
const API_BASE = location.protocol === 'file:' ? 'http://localhost:8000/api' : '/api';

// ---- 全局 401 拦截：token 过期/无效时任何接口返回 401 → 派发事件让界面自动登出（登录/恢复角色接口除外）----
const _hpFetch = window.fetch.bind(window);
window.fetch = async (...args) => {
  const r = await _hpFetch(...args);
  try {
    const url = String(args[0] || '');
    if (r.status === 401 && !url.includes('/auth/login') && !url.includes('/auth/me')) {
      window.dispatchEvent(new CustomEvent('hp-unauthorized'));
    }
  } catch(e){}
  return r;
};

// ---- 前端 service 层：真实调用 FastAPI（§6）----
const api = {
  token: localStorage.getItem('hp_token') || '',

  async login(username, password){
    const fd = new URLSearchParams();
    fd.append('username', username);
    fd.append('password', password);
    const r = await fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: fd
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || '登录失败'); }
    const d = await r.json();
    this.token = d.access_token;
    localStorage.setItem('hp_token', d.access_token);
    localStorage.setItem('hp_role', d.role || 'user');
    return d;
  },

  async uploadProduct(file, merchant){
    const fd = new FormData();
    fd.append('file', file);
    if (merchant && merchant.trim()) fd.append('merchant', merchant.trim());
    const r = await fetch(API_BASE + '/product/upload', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + this.token },
      body: fd
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || '上传失败'); }
    return r.json();
  },

  async listProducts(){
    const r = await fetch(API_BASE + '/product/list', {
      headers: { 'Authorization': 'Bearer ' + this.token }
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || '获取商品失败'); }
    const d = await r.json();
    return { rows: d.rows || [], merchants: d.merchants || [] };
  },

  async seedSample(){
    const r = await fetch(API_BASE + '/product/sample', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + this.token }
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || '初始化示例失败'); }
    return r.json();
  },

  // ---- 上传文件管理（v7.13）----
  async listUploads(){
    const r = await fetch(API_BASE + '/product/uploads', {
      headers: { 'Authorization': 'Bearer ' + this.token }
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || '获取上传记录失败'); }
    const d = await r.json();
    return d.rows || [];
  },
  async downloadUpload(id){
    const r = await fetch(API_BASE + '/product/uploads/' + id + '/download', {
      headers: { 'Authorization': 'Bearer ' + this.token }
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || '下载失败'); }
    return r.blob();
  },
  async restoreUpload(id){
    const r = await fetch(API_BASE + '/product/uploads/' + id + '/restore', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + this.token }
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || '恢复失败'); }
    return r.json();
  },
  async deleteUpload(id){
    const r = await fetch(API_BASE + '/product/uploads/' + id, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + this.token }
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || '删除失败'); }
    return r.json();
  },

  // ---- 商家偏远运费（商家级多行说明，仅展示不参与佣金）----
  async listMerchantFees(){
    const r = await fetch(API_BASE + '/merchant-fee/list', {
      headers: { 'Authorization': 'Bearer ' + this.token }
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || '获取运费配置失败'); }
    const d = await r.json();
    return d.rows || [];
  },
  async saveMerchantFee(merchant, fee_note){
    const r = await fetch(API_BASE + '/merchant-fee/save', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + this.token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ merchant, fee_note })
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || '保存失败'); }
    return r.json();
  },
  async batchSaveMerchantFees(items){
    const r = await fetch(API_BASE + '/merchant-fee/batch', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + this.token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ items })
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || '批量保存失败'); }
    return r.json();
  },
  async uploadMerchantFees(file){
    const fd = new FormData();
    fd.append('file', file);
    const r = await fetch(API_BASE + '/merchant-fee/upload', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + this.token },
      body: fd
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || '导入失败'); }
    return r.json();
  },
  async deleteMerchantFee(merchant){
    const r = await fetch(API_BASE + '/merchant-fee/' + encodeURIComponent(merchant), {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + this.token }
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || '删除失败'); }
    return r.json();
  },

  // 利润计算：净利润 = 售价 - 成本 - 平台服务费 - 税费（与后端 /api/profit/calculate 一致）
  calculateProfit(cost, sale_price, feeRate, taxRate){
    const fee = +(sale_price * feeRate).toFixed(2);
    const tax = +(sale_price * taxRate).toFixed(2);
    const profit = +(sale_price - cost - fee - tax).toFixed(2);
    const profit_rate = sale_price > 0 ? +(profit / sale_price * 100).toFixed(2) : 0;
    return { profit, profit_rate, fee, tax };
  },
  calculatePrice(cost, target_rate, feeRate, taxRate){
    const denom = 1 - target_rate - feeRate - taxRate;
    const sale_price = denom <= 0 ? cost : +(cost / denom).toFixed(2);
    return { sale_price };
  },

  async generatePlan(payload){
    const r = await fetch(API_BASE + '/plan/generate', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + this.token, 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || '生成失败'); }
    return r.blob();
  },

  // ---- 货盘记录（持久化）：列表 / 详情 / 重新下载 / 删除 ----
  async listPlans(){
    const r = await fetch(API_BASE + '/plan/list', {
      headers: { 'Authorization': 'Bearer ' + this.token }
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || '获取货盘列表失败'); }
    return r.json();

  async getPlan(id){

    return r.json();
  },
  async downloadPlan(id){
    const r = await fetch(API_BASE + '/plan/' + id + '/download', {
      headers: { 'Authorization': 'Bearer ' + this.token }
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || '重新生成失败'); }
    return r.blob();
  },
  async deletePlan(id){
    const r = await fetch(API_BASE + '/plan/' + id, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + this.token }
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || '删除失败'); }
    return r.json();
  },

  async downloadTemplate(){
    const r = await fetch(API_BASE + '/product/template', {
      headers: { 'Authorization': 'Bearer ' + this.token }
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || '下载模板失败'); }
    return r.blob();
  },

  async getLlmConfig(){
    const r = await fetch(API_BASE + '/config/llm', { headers: { 'Authorization': 'Bearer ' + this.token } });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || '读取配置失败'); }
    return r.json();
  },

  async setLlmConfig(cfg){
    const r = await fetch(API_BASE + '/config/llm', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + this.token, 'Content-Type': 'application/json' },
      body: JSON.stringify(cfg)
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || '保存配置失败'); }
    return r.json();
  }
};

// ---- 工具 ----
const fmt = (n) => (Math.round(n * 100) / 100).toLocaleString('zh-CN');
const marginWord = (m) => (m >= 50 ? '优' : m >= 30 ? '中' : '偏低');

// 示例商品图：canvas 生成 PNG（仅用于前端展示；上传/生成的真实图片走后端 image_url）
const CAT_COLORS = { '上衣':['#a78bfa','#7c3aed'], '裤装':['#60a5fa','#2563eb'],
  '裙装':['#f472b6','#db2777'], '外套':['#34d399','#059669'], '其他':['#fbbf24','#d97706'] };
function makeImg(name, category){
  const c = document.createElement('canvas'); c.width = 300; c.height = 300;
  const ctx = c.getContext('2d');
  const col = CAT_COLORS[category] || CAT_COLORS['其他'];
  const g = ctx.createLinearGradient(0,0,300,300); g.addColorStop(0,col[0]); g.addColorStop(1,col[1]);
  ctx.fillStyle = g; ctx.fillRect(0,0,300,300);
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  ctx.beginPath(); ctx.arc(235,70,70,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(60,250,50,0,7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.font = '600 18px "PingFang SC",sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(category || '商品', 24, 44);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '800 26px "PingFang SC",sans-serif';
  const words = name.split(''); const lines = []; let line = '';
  words.forEach(ch => { if ((line+ch).length > 5) { lines.push(line); line = ch; } else line += ch; });
  if (line) lines.push(line);
  lines.slice(0,3).forEach((l,i) => ctx.fillText(l, 150, 150 + i*34));
  return c.toDataURL('image/png');
}
function downloadBlob(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
function downloadBlobUrl(url, name){
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

    const llmForm = reactive({ base_url: '', api_key: '', model: '' });
    const llmSaving = ref(false);
    const llmStatus = ref(null);
    // §6 利润扣减：平台服务费费率 / 税费率（输入按 % 计，内部换算为小数）
    const feeRate = ref(6);
    const taxRate = ref(1);

    const loggedUser = ref(localStorage.getItem('hp_user') || '');
    const userRole = ref(localStorage.getItem('hp_role') || '');
    const isAdmin = computed(() => userRole.value === 'admin');
    const loginVisible = ref(!loggedUser.value);
    const loginForm = reactive({ username: 'admin', password: 'admin123' });
    const logging = ref(false);

    const hasProducts = computed(() => products.value.length > 0);
    const categories = computed(() => [...new Set(products.value.map(p => p.category))]);
    const filtered = computed(() => {
      const q = search.value.trim().toLowerCase();
      return products.value.filter(p => {
        if (catFilter.value && p.category !== catFilter.value) return false;
        if (merchantFilter.value && (p.merchant || '') !== merchantFilter.value) return false;
        if (q && !(p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q))) return false;
        return true;
      });
    });
    const allFilteredSelected = computed(() =>
      filtered.value.length > 0 && filtered.value.every(p => selectedSkus.value.includes(p.id)));
    const selectedProducts = computed(() =>
      products.value.filter(p => selectedSkus.value.includes(p.id)));

    function compute(pid){
      const p = products.value.find(x => x.id === pid); if (!p) return null;
      // 成本口径：一件代发 = 出厂价 + 快递代发费；集采 = 出厂价
      const base = Number(p.cost_price) || 0;
      const fee = costMode.value === 'daifa' ? (Number(p.shipping_fee) || 0) : 0;
      const cost = base + fee;
      const raw = pricing[pid];
      const f = (Number(feeRate.value) || 0) / 100;   // 输入为百分比，内部换算小数
      const t = (Number(taxRate.value) || 0) / 100;
      const cut = (Number(cutItem[pid]) || 0);        // 佣金下调百分点
      if (mode.value === 'price'){
        const sale_price = Number(raw) || 0;
        const r = api.calculateProfit(cost, sale_price, f, t);
        const commRate = Math.max(0, r.profit_rate - cut);
        const commission = +(sale_price * commRate / 100).toFixed(2);
        return { cost, price: sale_price, profit: r.profit, marginPct: r.profit_rate, fee: r.fee, tax: r.tax, commission, commRate };
      } else {
        const target = Number(raw) || 0;
        const r = api.calculatePrice(cost, target/100, f, t);
        const price = r.sale_price;
        const cr = api.calculateProfit(cost, price, f,  t);
        const commRate = Math.max(0, cr.profit_rate - cut);
        const commission = +(price * commRate / 100).toFixed(2);
        return { cost, price, profit: cr.profit, marginPct: cr.profit_rate, fee: cr.fee, tax: cr.tax, commission, commRate };
      }
    }
    const priced = (pid) => Number(pricing[pid]) > 0;
    const pricedCount = computed(() => selectedSkus.value.filter(s => priced(s)).length);
    const allPriced = computed(() => selectedSkus.value.length > 0 && pricedCount.value === selectedSkus.value.length);

    const previewRows = computed(() => selectedProducts.value.map(p => {
      const c = compute(p.id);
      return { sku:p.sku, name:p.name, img:p.img, cost:c.cost, price:c.price, profit:c.profit, marginPct:c.marginPct, fee:c.fee, tax:c.tax };
    }));
    const summary = computed(() => {
      const rows = previewRows.value;
      const cost = rows.reduce((s,r) => s + r.cost, 0);
      const price = rows.reduce((s,r) => s + r.price, 0);
      const fee = rows.reduce((s,r) => s + (r.fee || 0), 0);
      const tax = rows.reduce((s,r) => s + (r.tax || 0), 0);
      const profit = rows.reduce((s,r) => s + (r.profit || 0), 0);
      const avg = price > 0 ? profit / price * 100 : 0;
      return { cost, price, fee, tax, profit, avg };
    });

    function toggleSel(row, v){ v ? addSel(row.id) : removeSel(row.id); }
    function addSel(pid){ if (!selectedSkus.value.includes(pid)) selectedSkus.value.push(pid); }
    function removeSel(pid){ selectedSkus.value = selectedSkus.value.filter(s => s !== pid); }
    function toggleAllFiltered(v){ filtered.value.forEach(p => v ? addSel(p.id) : removeSel(p.id)); }
    function selectAllFiltered(){ filtered.value.forEach(p => addSel(p.id)); }

    function batchApply(){
      if (batchVal.value == null) { Msg.warning('请输入批量数值'); return; }
      selectedSkus.value.forEach(s => pricing[s] = batchVal.value);
      Msg.success('已应用到 ' + selectedSkus.value.length + ' 个商品');
    }

    function markupApplyAll(){
      if (markupAllVal.value == null) { Msg.warning('请输入成本上调%'); return; }
      if (planType.value !== 'private') return;
      selectedSkus.value.forEach(s => markup[s] = markupAllVal.value);
      Msg.success('已为 ' + selectedSkus.value.length + ' 个商品设置成本上调 ' + markupAllVal.value + '%（可再单独调整）');
    }

    function cutApplyAll(){
      if (commissionCut.value == null) { Msg.warning('请输入佣金下调（百分点）'); return; }
      if (planType.value !== 'public') return;
      selectedSkus.value.forEach(s => cutItem[s] = commissionCut.value);
      Msg.success('已为 ' + selectedSkus.value.length + ' 个商品设置佣金下调 ' + commissionCut.value + ' 个点（可再单独调整）');
    }

    function mapProduct(r){
      return {
        id: r.id, sku: r.sku, name: r.name, cost_price: r.cost_price,
        shipping_fee: Number(r.shipping_fee) || 0,
        merchant: r.merchant || '',
        category: r.category || '其他', remark: r.remark,
        // v7 新字段（私域 22 列 / 公域规格列）
        spec: r.spec || '',
        product_type: r.product_type || '',
        ingredients: r.ingredients || '',
        stock: r.stock || '',
        origin: r.origin || '',
        lead_time: r.lead_time || '',
        shelf_life: r.shelf_life || '',
        after_sales: r.after_sales || '',
        market_price: r.market_price || '',
        excluded_regions: r.excluded_regions || '',
        image_url: r.image_url || '',
        img: r.image_url || makeImg(r.name, r.category || '其他')
      };
    }

    async function refreshProducts(){
      try {
        const d = await api.listProducts();
        products.value = d.rows.map(mapProduct);
        merchants.value = d.merchants;
      } catch(e){ Msg.error(e.message); }
    }

    async function doLogin(){
      logging.value = true;
      try {
        const d = await api.login(loginForm.username, loginForm.password);
        loggedUser.value = loginForm.username;
        userRole.value = d.role || 'user';
        localStorage.setItem('hp_user', loginForm.username);
        localStorage.setItem('hp_role', userRole.value);
        loginVisible.value = false;
        Msg.success('登录成功');
        await refreshProducts();
        await loadLlmConfig();
        await loadGenerated();   // 货盘记录（持久化）
      } catch(e){ Msg.error(e.message); }
      logging.value = false;
    }
    // 刷新页面时用 /api/auth/me 恢复角色（避免老登录态丢失 hp_role 后误判为普通用户）
    async function loadMe(){
      if (!api.token) return;
      try {
        const r = await fetch(API_BASE + '/auth/me', { headers: { 'Authorization': 'Bearer ' + api.token } });
        if (r.ok) { const d = await r.json(); userRole.value = d.role || 'user'; localStorage.setItem('hp_role', userRole.value); }
        else if (r.status === 401) logout(true);   // token 已过期：自动回登录页，不再静默停留假登录态
      } catch(e){ /* 网络异常保持现状 */ }
    }
    if (loggedUser.value) loadMe();
    function logout(silent){
      api.token = ''; loggedUser.value = ''; userRole.value = '';
      localStorage.removeItem('hp_token'); localStorage.removeItem('hp_user'); localStorage.removeItem('hp_role');
      products.value = []; loginVisible.value = true;
      Msg.info(silent ? '登录已过期，请重新登录' : '已退出登录');
    }
    // 任何接口 401（token 过期/无效）→ 自动退回登录页（手动退出走 logout() 不受影响）
    window.addEventListener('hp-unauthorized', () => { if (api.token) logout(true); });

    async function loadSample(){
      try {
        const d = await api.seedSample();
        Msg.success('已初始化示例商品库（新增 ' + d.inserted + ' 个）');
        await refreshProducts();
        selectedSkus.value = products.value.map(p => p.id);
        Object.keys(pricing).forEach(k => delete pricing[k]);
        Object.keys(markup).forEach(k => delete markup[k]);
        Object.keys(cutItem).forEach(k => delete cutItem[k]);
        products.value.forEach(p => pricing[p.id] = Math.round(p.cost_price * 2.5));
      } catch(e){ Msg.error(e.message); }
    }

    async function onUploadChange(file){
      const raw = file.raw; if (!raw) return;
      try {
        const d = await api.uploadProduct(raw, merchantInput.value);
        Msg.success('已上传 ' + d.inserted + ' 个商品，商家：' + d.merchant);
        merchantInput.value = '';
        merchantFilter.value = '';
        await refreshProducts();
        await loadUploads();
        selectedSkus.value = products.value.map(p => p.id);
        Object.keys(pricing).forEach(k => delete pricing[k]);
        Object.keys(markup).forEach(k => delete markup[k]);
        Object.keys(cutItem).forEach(k => delete cutItem[k]);
        products.value.forEach(p => pricing[p.id] = Math.round(p.cost_price * 2.5));
      } catch(e){ Msg.error(e.message); }
    }

    async function exportTemplate(){
      try {
        const blob = await api.downloadTemplate();
        downloadBlob(blob, '商品库导入模板.xlsx');
        Msg.success('模板已下载');
      } catch(e){ Msg.error(e.message); }
    }

    async function generate(){
      if (!allPriced.value) { Msg.warning('请先完成全部商品定价'); return; }
      generating.value = true;
      const list = selectedProducts.value;
      const fname = (fileName.value || '新货盘') + '.xlsx';
      try {
        const items = list.map(p => {
          const c = compute(p.id);
          return {
            product_id: p.id,   // v7.12 补传商品主键（此前缺失，明细无法关联商品/原图）
            sku: p.sku, name: p.name, image_url: p.img,
            cost_price: Number(p.cost_price) || 0,
            shipping_fee: Number(p.shipping_fee) || 0,
            sale_price: c.price,
            pricing_mode: mode.value, category: p.category, remark: p.remark,
            merchant: p.merchant,
            // v7 新字段透传（公域用 spec；私域全量）
            spec: p.spec, product_type: p.product_type, ingredients: p.ingredients,
            stock: p.stock, origin: p.origin, lead_time: p.lead_time,
            shelf_life: p.shelf_life, after_sales: p.after_sales,
            market_price: p.market_price, excluded_regions: p.excluded_regions,
            markup_pct: Number(markup[p.id]) || 0,  // v7.2 私域一件代发价上浮%
            commission_cut: Number(cutItem[p.id]) || 0  // v7.4 公域逐商品佣金下调（百分点）
          };
        });
        const blob = await api.generatePlan({
          name: fileName.value || '新货盘',
          title: (planTitle.value || '').trim(),
          commission_cut: Number(commissionCut.value) || 0,
          cost_mode: costMode.value,
          plan_type: planType.value,
          tax_rate: (Number(planTaxPct.value) || 0) / 100,
          fee_rate: (Number(feeRate.value) || 0) / 100,
          items
        });
        downloadBlob(blob, fname);
        Msg.success('货盘已生成并下载：' + fname);
        // 同步后端货盘记录（v7.9：去掉生成后自动弹出的卡片墙预览）
        await loadGenerated();
      } catch(err){ Msg.error('生成失败：' + err.message); }
      generating.value = false;
    }

    // ---- 货盘记录（后端持久化）+ 可视化预览 ----
    async function loadGenerated(){
      try {
        const d = await api.listPlans();
        generated.value = (d || []).map(p => ({
          id: p.id, name: p.name + '.xlsx', time: p.create_time, rows: p.rows,
          commission_cut: p.commission_cut, cost_mode: p.cost_mode,
          plan_type: p.plan_type || 'public', tax_rate: p.tax_rate || 0
        }));
      } catch(e){ Msg.error(e.message); }
    }
    async function openPreview(row){
      previewVisible.value = true;
      previewLoading.value = true;
      previewItems.value = [];
      previewPlan.value = { ...row };
      try {
        const d = await api.getPlan(row.id);
        previewPlan.value = { ...row, ...d, name: (d.name || row.name || '').replace(/\.xlsx$/i,'') };
        previewItems.value = d.items || [];
      } catch(e){ Msg.error('加载预览失败：' + e.message); }
      previewLoading.value = false;
    }
    async function downloadGen(row){
      try {
        if (row.id && String(row.id).indexOf('g') !== 0) {
          const blob = await api.downloadPlan(row.id);
          downloadBlob(blob, (row.name || '货盘').replace(/\.xlsx$/i,'') + '.xlsx');
        } else if (row.url) {
          downloadBlobUrl(row.url, row.name || '货盘.xlsx');
        } else {
          Msg.warning('该记录缺少下载数据');
        }
      } catch(e){ Msg.error(e.message); }
    }
    async function deleteGen(row){
      try {
        await ElMessageBox.confirm('确定删除货盘「' + row.name + '」？', '删除确认', { type: 'warning' });
        await api.deletePlan(row.id);
        generated.value = generated.value.filter(x => x.id !== row.id);
        if (previewVisible.value && previewPlan.value.id === row.id) previewVisible.value = false;
        Msg.success('已删除');
      } catch(e){ if (e !== 'cancel' && e !== 'close') Msg.error(e.message); }
    }

    // ---- 上传文件管理（v7.13）----
    function fmtSize(n){
      if (!n) return '—';
      if (n < 1024) return n + ' B';
      if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
      return (n/1024/1024).toFixed(2) + ' MB';
    }
    async function loadUploads(){
      try { uploads.value = await api.listUploads(); }
      catch(e){ Msg.error(e.message); }
    }
    async function downloadUploadFile(row){
      try {
        const blob = await api.downloadUpload(row.id);
        downloadBlob(blob, row.filename || '上传文件.xlsx');
      } catch(e){ Msg.error(e.message); }
    }
    async function restoreUpload(row){
      try {
        await ElMessageBox.confirm(
          '恢复后当前商品库将被「' + row.filename + '」的内容整体替换，确定恢复？',
          '恢复商品库', { type: 'warning', confirmButtonText: '恢复', cancelButtonText: '取消' });
        const d = await api.restoreUpload(row.id);
        Msg.success('已恢复 ' + d.inserted + ' 个商品，商家：' + (d.merchant || '未识别'));
        await loadUploads();
        await refreshProducts();
        selectedSkus.value = products.value.map(p => p.id);
        Object.keys(pricing).forEach(k => delete pricing[k]);
        Object.keys(markup).forEach(k => delete markup[k]);
        Object.keys(cutItem).forEach(k => delete cutItem[k]);
        products.value.forEach(p => pricing[p.id] = Math.round(p.cost_price * 2.5));
      } catch(e){ if (e !== 'cancel' && e !== 'close') Msg.error(e.message); }
    }
    async function deleteUpload(row){
      try {
        await ElMessageBox.confirm('确定删除上传记录「' + row.filename + '」？存档文件将一并删除，不影响当前商品库。', '删除确认', { type: 'warning' });
        await api.deleteUpload(row.id);
        uploads.value = uploads.value.filter(x => x.id !== row.id);
        Msg.success('已删除');
      } catch(e){ if (e !== 'cancel' && e !== 'close') Msg.error(e.message); }
    }

    async function loadLlmConfig(){
      try {
        const cfg = await api.getLlmConfig();
        llmForm.base_url = cfg.LLM_BASE_URL || '';
        llmForm.api_key = cfg.LLM_API_KEY || '';
        llmForm.model = cfg.LLM_MODEL || '';
      } catch(e){ Msg.error(e.message); }
    }
    async function saveLlmConfig(){
      llmSaving.value = true;
      try {
        const cfg = {
          LLM_BASE_URL: llmForm.base_url.trim(),
          LLM_API_KEY: llmForm.api_key.trim(),
          LLM_MODEL: llmForm.model.trim()
        };
        await api.setLlmConfig(cfg);
        llmStatus.value = { type: 'success', text: '已保存，即时生效' };
        Msg.success('模型配置已保存');
      } catch(e){ llmStatus.value = { type: 'danger', text: e.message }; Msg.error(e.message); }
      llmSaving.value = false;
    }

    function goStep(n){ active.value = n; window.scrollTo({ top:0, behavior:'smooth' }); }

    return {
      active, products, selectedSkus, mode, pricing, markup, cutItem, search, catFilter, batchVal, markupAllVal,
      merchantInput, merchantFilter, merchants,
      feeRate, taxRate,
      fileName, planTitle, planType, planTaxPct, commissionCut, costMode, generated, filesVisible, generating, llmCollapse, llmForm, llmSaving, llmStatus,
      uploadsVisible, uploads,
      previewVisible, previewPlan, previewItems, previewLoading,
      loggedUser, loginVisible, loginForm, logging,
      isAdmin,
      hasProducts, categories, filtered, allFilteredSelected, selectedProducts,
      priced, pricedCount, allPriced, previewRows, summary,
      compute, marginWord, marginType, fmt,
      toggleSel, toggleAllFiltered, selectAllFiltered, batchApply, markupApplyAll, cutApplyAll,
      doLogin, logout, loadSample, onUploadChange, exportTemplate, generate, downloadGen, deleteGen, loadLlmConfig, saveLlmConfig, goStep,
      loadUploads, downloadUploadFile, restoreUpload, deleteUpload, fmtSize,
      loadGenerated, openPreview,
      Folder, Download, MagicStick, UploadFilled, Search, Delete, SwitchButton, Plus, View, Files, RefreshRight
    };
  }
}).use(ElementPlus, window.ElementPlusLocaleZhCn ? { locale: window.ElementPlusLocaleZhCn } : {})
  .mount('#app');
</script>
</body>
</html>
